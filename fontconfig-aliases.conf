<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
Word's newest default theme font is "Aptos" (headings: "Aptos Display", body: "Aptos") -
Microsoft's 2023 replacement for Calibri. Unlike Calibri/Cambria, Aptos has no freely
redistributable metric-compatible clone available (Microsoft's own Aptos font files require
a separate redistribution license to install on a server - see
https://learn.microsoft.com/en-us/typography/font-list/aptos - so they can't just be bundled
into this image the way fonts-crosextra-carlito/-caladea were for Calibri/Cambria).

Without this file, LibreOffice's DOCX import asks fontconfig for "Aptos"/"Aptos Display",
finds neither installed, and falls back to whatever generic sans-serif fontconfig's own
default substitution picks (commonly DejaVu Sans) - a font with noticeably different,
wider character metrics than Aptos, which reflows line breaks and makes text look larger
relative to the page than it does in Word.

These aliases redirect that lookup to Carlito/Caladea instead (already installed for the
Calibri/Cambria fix) - not a true metric clone of Aptos, but visually and metrically much
closer to it than the fontconfig default fallback, since Aptos and Calibri are both
Microsoft's default-UI-style humanist sans fonts of similar proportions.

The rest of the aliases below cover the other Microsoft UI/theme fonts that show up often in
real documents (Segoe UI, Tahoma, Verdana, Georgia, Consolas) and, like Aptos, have no freely
redistributable metric clone available. Same tradeoff applies to all of them: a same-category
best-effort substitute from what's already installed, not a true metric match - see
ensure_word_fonts_available() in main.py, which detects (and tries to fetch from Google Fonts)
any *other* font a document asks for that isn't covered here, so real gaps in this list show
up instead of failing invisibly.

The "Segoe UI Emoji" alias is a different case: Word tags emoji/dingbat characters with this
font even in an otherwise plain-text document, and unlike the fonts above, none of Carlito/
Caladea/DejaVu/Liberation have emoji glyphs *at all* - without this alias those characters
convert to empty boxes, not just a visually-different substitute. fonts-noto-color-emoji
(installed in the Dockerfile) actually has the glyphs, so this alias points at a real fix
rather than a same-category approximation.
-->
<fontconfig>
  <alias>
    <family>Aptos</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Aptos Display</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Aptos Serif</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Verdana</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Georgia</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias>
    <family>Consolas</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI Emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
